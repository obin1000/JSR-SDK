name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # Build and test exactly what gets released.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: Download release layout
        uses: actions/download-artifact@v8
        with:
          name: jsr-sdk
          path: package
      - name: Write version to file
        shell: pwsh
        run: Set-Content -Path "${{github.workspace}}\package\VERSION" -Value "${{github.ref_name}}" -Encoding ASCII
      - name: Zip release
        shell: pwsh
        run: Compress-Archive -Path '${{github.workspace}}\package\include','${{github.workspace}}\package\lib', '${{github.workspace}}\package\cmake', '${{github.workspace}}\package\CMakeLists.txt', '${{github.workspace}}\package\LICENSE', '${{github.workspace}}\package\VERSION' -DestinationPath '${{github.workspace}}\JSR-SDK-${{ github.ref_name }}.zip' -Force
      - name: Generate hash
        shell: pwsh
        run: |
            $hash = (Get-FileHash -Path ${{github.workspace}}\JSR-SDK-${{ github.ref_name }}.zip -Algorithm SHA256).Hash
            $hash | Out-File -Encoding ascii "${{github.workspace}}\JSR-SDK-${{ github.ref_name }}.zip.sha256"
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # A tag with a suffix, such as v1.0.0-rc.1, is a release candidate.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{github.workspace}}\JSR-SDK-${{ github.ref_name }}.zip
            ${{github.workspace}}\JSR-SDK-${{ github.ref_name }}.zip.sha256
