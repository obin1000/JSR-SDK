name: CI

# Builds the library, runs the unit tests and then builds and runs small
# programs against the release layout with every supported compiler.
# release.yml calls this workflow too, so a release is exactly what CI tested.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # The C and C++ code must follow .clang-format (#21). The clang-format
  # version is pinned (tools/format.py names it), because versions differ on
  # a few lines. Run "python tools/format.py" to format.
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check formatting
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet clang-format==23.1.4
          CLANG_FORMAT="$RUNNER_TEMP/venv/bin/clang-format" python3 tools/format.py --check

  build:
    name: Build library (MSVC, C++/CLI)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # jsr_sdk.h, jsr_sdk_c.cpp, jsr_sdk.hpp and CApiParityTest.cpp are
      # generated from tools/gen_c_api; fail if someone edited them by hand or
      # forgot to regenerate.
      - name: Check that generated C API code is up to date
        run: python tools/gen_c_api/generate.py --check

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      # JSR_GetLibraryVersion() returns it: the tag without its "v" for a
      # release (release.yml calls this workflow for the tag), otherwise a dev
      # version naming the commit.
      - name: Choose the library version
        shell: pwsh
        run: |
          $version = '0.0.0-dev+' + '${{ github.sha }}'.Substring(0, 7)
          if ('${{ github.ref_type }}' -eq 'tag') { $version = '${{ github.ref_name }}'.TrimStart('v') }
          "JSR_SDK_VERSION=$version" >> $env:GITHUB_ENV
          "Library version: $version"

      - name: Build x64 dynamic library
        run: msbuild JSR-SDK.vcxproj -t:Rebuild -p:Configuration=dynamic -p:Platform=x64 -p:JsrSdkVersion=${{ env.JSR_SDK_VERSION }}

      - name: Build x86 dynamic library
        run: msbuild JSR-SDK.vcxproj -t:Rebuild -p:Configuration=dynamic -p:Platform=Win32 -p:JsrSdkVersion=${{ env.JSR_SDK_VERSION }}

      # The unit tests (test/CMakeLists.txt), for x64 and x86: clr_tests (C++/CLI,
      # the DLL's internals and the C API against the C++ interface) and
      # capi_tests (portable; the consumer jobs also run them with every
      # compiler). They include simulator tests: the SDK's diagnostics plugin
      # simulates pulser-receivers, so they need no hardware. The integration
      # tests need a real pulser-receiver and stay manual.
      # clr_tests is a .NET program: if a manager's threads outlive it, it never
      # exits, so fail fast instead of waiting for the job's 6-hour limit.
      # Visual Studio's own CMake is used because it always knows the installed
      # Visual Studio generator; v143 matches the library's toolset.
      - name: Run unit tests (x64 and x86)
        timeout-minutes: 30
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $env:PATH = (Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin') + ";$env:PATH"
          cmake --version
          foreach ($arch in 'x64', 'Win32') {
            cmake -S test -B "build/test-$arch" -A $arch -T v143 "-DJSR_SDK_EXPECTED_VERSION=$env:JSR_SDK_VERSION"
            if ($LASTEXITCODE -ne 0) { throw "Configuring the $arch tests failed" }
            cmake --build "build/test-$arch" --config Release
            if ($LASTEXITCODE -ne 0) { throw "Building the $arch tests failed" }
            ctest --test-dir "build/test-$arch" -C Release --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw "The $arch tests failed" }
          }

      # Full page heap puts every allocation at the end of its own page and
      # makes freed memory inaccessible, so a use-after-free crashes where it
      # happens instead of corrupting the heap quietly (#24). The simulator
      # suites include the #14 callback stress test, repeated three times.
      # The registry key (Image File Execution Options) is what
      # gflags /p /enable writes; the runner is an administrator. Page heap
      # needs crashes to end the process, which they do since #36.
      - name: Run the simulator tests under full page heap (x64)
        timeout-minutes: 30
        shell: pwsh
        run: |
          $ifeo = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\capi_tests.exe'
          New-Item $ifeo -Force | Out-Null
          New-ItemProperty $ifeo -Name GlobalFlag -Value 0x02000000 -PropertyType DWord -Force | Out-Null
          New-ItemProperty $ifeo -Name PageHeapFlags -Value 0x3 -PropertyType DWord -Force | Out-Null
          try {
            build/test-x64/capi/Release/capi_tests.exe --gtest_filter=CApiSimulatorTest.*:JsrManagerSimulatorTest.* --gtest_repeat=3
            if ($LASTEXITCODE -ne 0) { throw "The simulator tests failed under page heap (exit code $LASTEXITCODE)" }
          } finally {
            Remove-Item $ifeo -Recurse -Force
          }

      - name: Check that the C API covers JSRSDKManager
        run: python ci/check_c_api_parity.py

      - name: Check DLL exports
        shell: pwsh
        run: |
          ./ci/check-exports.ps1 -Dll lib/x64/dynamic/JSR-SDK.dll -AllowedPatterns 'JSR_*'
          ./ci/check-exports.ps1 -Dll lib/Win32/dynamic/JSR-SDK.dll -AllowedPatterns 'JSR_*'

      - name: Set up MSYS2 for the MinGW import libraries
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-tools-git mingw-w64-ucrt-x86_64-binutils

      - name: Create MinGW import libraries
        shell: msys2 {0}
        run: |
          bash ci/make-mingw-implib.sh lib/x64/dynamic/JSR-SDK.dll x64
          bash ci/make-mingw-implib.sh lib/Win32/dynamic/JSR-SDK.dll Win32

      # Make sure the export check can fail: with one allowed name too few it
      # must reject the DLL.
      - name: Check that the export check rejects unexpected exports
        shell: pwsh
        run: |
          ./ci/check-exports.ps1 -Dll lib/x64/dynamic/JSR-SDK.dll -Allowed CreateJSRSDKManager
          if ($LASTEXITCODE -ne 1) { throw "check-exports.ps1 accepted an unexpected export" }
          exit 0

      - name: Upload release layout
        uses: actions/upload-artifact@v7
        with:
          name: jsr-sdk
          path: |
            include/
            lib/
            cmake/
            CMakeLists.txt
            LICENSE
          if-no-files-found: error
          retention-days: 7

  consumer:
    name: Consumer (${{ matrix.name }})
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC x64
            arch: x64
            cc: cl
          - name: MSVC x86
            arch: x86
            cc: cl
          - name: clang-cl x64
            arch: x64
            cc: clang-cl
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release layout
        uses: actions/download-artifact@v8
        with:
          name: jsr-sdk
          path: jsr-sdk

      # Runs vcvarsall.bat and passes the variables it changes (PATH, INCLUDE,
      # LIB, ...) on to the following steps. This is what ilammy/msvc-dev-cmd
      # did; that action still needs Node.js 20 (#28).
      - name: Set up the MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $arch = if ('${{ matrix.arch }}' -eq 'x86') { 'amd64_x86' } else { 'amd64' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          $lines = cmd /c "`"$vcvars`" $arch >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvarsall.bat $arch failed" }
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$' -and
                [Environment]::GetEnvironmentVariable($Matches[1]) -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Configure
        run: >
          cmake -S ci/consumer -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cc }}
          -DJSR_SDK_DIR="${{ github.workspace }}/jsr-sdk"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # MinGW compilers can only use the C API and the C++ wrapper.
  consumer-mingw:
    name: Consumer (${{ matrix.name }})
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MinGW GCC x64
            msystem: UCRT64
            toolchain: gcc
            cc: gcc
            cxx: g++
          # MinGW GCC x86 is the consumer-mingw-x86 job: MSYS2 is phasing out
          # its 32-bit environments (#30).
          - name: MinGW clang x64
            msystem: CLANG64
            toolchain: clang
            cc: clang
            cxx: clang++
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release layout
        uses: actions/download-artifact@v8
        with:
          name: jsr-sdk
          path: jsr-sdk

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          pacboy: >-
            ${{ matrix.toolchain }}:p
            cmake:p
            ninja:p

      - name: Show compiler
        run: ${{ matrix.cc }} --version

      - name: Configure
        run: >
          cmake -S ci/consumer -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DJSR_SDK_DIR="$(cygpath -m "$GITHUB_WORKSPACE/jsr-sdk")"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # 32-bit MinGW GCC. MSYS2 is phasing out its 32-bit environments with no
  # replacement (#30), so the compiler comes from a WinLibs release, which
  # also brings CMake and Ninja. Pinned by URL and SHA-256: update both
  # together, from the release's .sha256 file.
  consumer-mingw-x86:
    name: Consumer (MinGW GCC x86)
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      WINLIBS_URL: https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-23.1.3-14.0.0-ucrt-r3/winlibs-i686-posix-dwarf-gcc-16.2.0-mingw-w64ucrt-14.0.0-r3.7z
      WINLIBS_SHA256: e7579b167bce7f16358874133eac11dc369eb02f1735ec33695d4f5b0da77fda
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release layout
        uses: actions/download-artifact@v8
        with:
          name: jsr-sdk
          path: jsr-sdk

      - name: Install MinGW GCC x86 (WinLibs)
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'winlibs-i686.7z'
          Invoke-WebRequest $env:WINLIBS_URL -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($hash -ne $env:WINLIBS_SHA256) {
            throw "WinLibs checksum mismatch: got $hash, expected $env:WINLIBS_SHA256"
          }
          7z x $archive "-o$env:RUNNER_TEMP" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Extracting WinLibs failed" }
          # Prepended to PATH for the following steps, ahead of any other gcc.
          Join-Path $env:RUNNER_TEMP 'mingw32\bin' | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          # WinLibs' CMake uses GnuTLS without any trusted CA certificates, so
          # it can't verify https downloads (googletest). Give it the CA bundle
          # that Git for Windows installs (its location depends on the Git
          # version), instead of turning verification off.
          $ca = @(
            'C:\Program Files\Git\ucrt64\etc\ssl\certs\ca-bundle.crt',
            'C:\Program Files\Git\mingw64\etc\ssl\certs\ca-bundle.crt',
            'C:\Program Files\Git\usr\ssl\certs\ca-bundle.crt'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $ca) { throw "No CA bundle found in the Git for Windows installation" }
          "JSR_CA_BUNDLE=$($ca -replace '\\', '/')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Show compiler
        run: |
          gcc --version
          cmake --version
          $target = gcc -dumpmachine
          if ($target -notlike 'i686-*') { throw "Expected a 32-bit gcc, got $target" }

      - name: Configure
        run: >
          cmake -S ci/consumer -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_TLS_CAINFO="$env:JSR_CA_BUNDLE"
          -DJSR_SDK_DIR="${{ github.workspace }}/jsr-sdk"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
