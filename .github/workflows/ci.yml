name: CI

# Builds the library, runs the unit tests and then builds and runs small
# programs against the release layout with every supported compiler.
# release.yml calls this workflow too, so a release is exactly what CI tested.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build library (MSVC, C++/CLI)
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: msbuild JSR-SDK.sln -t:restore -p:RestorePackagesConfig=true

      # The solution maps dynamic|x64 to the library and the x64 unit tests.
      - name: Build x64 dynamic library and unit tests
        run: msbuild JSR-SDK.sln -t:Rebuild -p:Configuration=dynamic -p:Platform=x64

      - name: Build x86 dynamic library
        run: msbuild JSR-SDK.vcxproj -t:Rebuild -p:Configuration=dynamic -p:Platform=Win32

      - name: Build x64 static library
        run: msbuild JSR-SDK.vcxproj -t:Rebuild -p:Configuration=static -p:Platform=x64

      - name: Build x86 static library
        run: msbuild JSR-SDK.vcxproj -t:Rebuild -p:Configuration=static -p:Platform=Win32

      # The integration tests need a pulser-receiver attached, so they stay manual.
      - name: Run unit tests
        run: x64\Release\test.exe --gtest_filter=-*IntegrationTest.*

      - name: Check that the C API covers JSRSDKManager
        run: python ci/check_c_api_parity.py

      - name: Check DLL exports
        shell: pwsh
        run: |
          ./ci/check-exports.ps1 -Dll lib/x64/dynamic/JSR-SDK.dll -AllowedPatterns 'JSR_*'
          ./ci/check-exports.ps1 -Dll lib/Win32/dynamic/JSR-SDK.dll -AllowedPatterns 'JSR_*'

      - name: Set up MSYS2 for the MinGW import libraries
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-tools-git mingw-w64-ucrt-x86_64-binutils

      - name: Create MinGW import libraries
        shell: msys2 {0}
        run: |
          bash ci/make-mingw-implib.sh lib/x64/dynamic/JSR-SDK.dll x64
          bash ci/make-mingw-implib.sh lib/Win32/dynamic/JSR-SDK.dll Win32

      - name: Upload release layout
        uses: actions/upload-artifact@v4
        with:
          name: jsr-sdk
          path: |
            include/
            lib/
            CMakeLists.txt
            LICENSE
          if-no-files-found: error
          retention-days: 7

  consumer:
    name: Consumer (${{ matrix.name }})
    needs: build
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC x64
            arch: x64
            cc: cl
          - name: MSVC x86
            arch: x86
            cc: cl
          - name: clang-cl x64
            arch: x64
            cc: clang-cl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release layout
        uses: actions/download-artifact@v4
        with:
          name: jsr-sdk
          path: jsr-sdk

      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Configure
        run: >
          cmake -S ci/consumer -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cc }}
          -DJSR_SDK_DIR="${{ github.workspace }}/jsr-sdk"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # MinGW compilers can only use the C API and the C++ wrapper.
  consumer-mingw:
    name: Consumer (${{ matrix.name }})
    needs: build
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MinGW GCC x64
            msystem: UCRT64
            toolchain: gcc
            cc: gcc
            cxx: g++
          - name: MinGW GCC x86
            msystem: MINGW32
            toolchain: gcc
            cc: gcc
            cxx: g++
          - name: MinGW clang x64
            msystem: CLANG64
            toolchain: clang
            cc: clang
            cxx: clang++
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release layout
        uses: actions/download-artifact@v4
        with:
          name: jsr-sdk
          path: jsr-sdk

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          pacboy: >-
            ${{ matrix.toolchain }}:p
            cmake:p
            ninja:p

      - name: Show compiler
        run: ${{ matrix.cc }} --version

      - name: Configure
        run: >
          cmake -S ci/consumer -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DJSR_SDK_DIR="$(cygpath -m "$GITHUB_WORKSPACE/jsr-sdk")"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
